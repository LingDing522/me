<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC服务器管理站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mcGreen: '#4CAF50',
                        mcDark: '#222222',
                        mcGray: '#333333',
                    }
                }
            }
        }
    </script>
    <style>
        .mc-bg {
            background-image: url('https://picsum.photos/id/237/1920/1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-mc {
            background: #4CAF50;
            transition: all 0.2s;
        }
        .btn-mc:hover {
            background: #388E3C;
            transform: scale(1.02);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 3px;
        }
        /* 复制成功提示 */
        #copyTip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 200;
            display: none;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="mc-bg min-h-screen text-white overflow-x-hidden">
    <!-- 复制成功提示 -->
    <div id="copyTip">已复制到剪贴板</div>

    <!-- 主页面内容 -->
    <div class="container mx-auto px-4 py-12">
        <div class="glass rounded-xl p-6 mb-8">
            <h1 class="text-4xl font-bold text-center text-mcGreen mb-6">我的世界服务器中心</h1>

            <!-- 服务器切换选择 -->
            <div class="mb-6">
                <h3 class="text-lg mb-2">选择服务器：</h3>
                <select id="serverSelect" onchange="changeServer()" class="w-full md:w-1/2 bg-mcGray p-3 rounded border border-gray-600 text-lg">
                    <option data-ip="暂时没有（之后这里填着地址）">中秋国庆活动服</option>
                </select>
                <div class="mt-4 p-4 bg-mcDark rounded-lg flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                    <p class="text-xl">当前服务器地址：<span id="currentIp" class="text-mcGreen font-bold">暂时没有</span></p>
                    <button onclick="copyCurrentIp()" class="btn-mc px-4 py-2 rounded flex items-center gap-2 self-start md:self-auto">
                        <i class="fa fa-copy"></i>
                        <span>一键复制IP</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 管理人员（写死静态） -->
        <div class="glass rounded-xl p-6 mb-8">
            <h2 class="text-2xl mb-4 text-mcGreen">服务器管理人员</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">LingDing5</p>
                    <p class="text-mcGreen mt-1">服主</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">China_players</p>
                    <p class="text-mcGreen mt-1">荣誉服主（管理）</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">YCheng</p>
                    <p class="text-mcGreen mt-1">副服主</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">xiaofan_qie</p>
                    <p class="text-mcGreen mt-1">副服主</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">zq1</p>
                    <p class="text-mcGreen mt-1">副服主</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">Louis</p>
                    <p class="text-mcGreen mt-1">高级管理</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">Mifcckh2155</p>
                    <p class="text-mcGreen mt-1">高级管理</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">双城耀星</p>
                    <p class="text-mcGreen mt-1">高级管理</p>
                </div>
                <div class="bg-mcDark p-3 rounded-lg text-center">
                    <p class="text-lg font-bold">youwqeas</p>
                    <p class="text-mcGreen mt-1">高级管理</p>
                </div>
            </div>
        </div>

        <!-- 问答（写死静态） -->
        <div class="glass rounded-xl p-6">
            <h2 class="text-2xl mb-4 text-mcGreen">常见问答</h2>
            <div class="space-y-4">
                <div class="bg-mcDark p-4 rounded-lg">
                    <p class="text-mcGreen font-bold mb-2">Q：服务器需要正版吗</p>
                    <p class="text-gray-100">A：不用</p>
                </div>
                <div class="bg-mcDark p-4 rounded-lg">
                    <p class="text-mcGreen font-bold mb-2">Q：服务器什么时候开，以及地址</p>
                    <p class="text-gray-100">A：目前暂定节假日，地址每次不同，需及时关注</p>
                </div>
            </div>
        </div>
    </div>

<script>
// 服务器切换
function changeServer() {
    const sel = document.getElementById('serverSelect');
    const ip = sel.options[sel.selectedIndex].dataset.ip || '暂时没有';
    document.getElementById('currentIp').innerText = ip;
}

// 复制IP
function copyCurrentIp() {
    const ip = document.getElementById('currentIp').innerText;
    if (ip === '暂时没有') {
        alert("目前暂无服务器IP！");
        return;
    }
    copyText(ip);
}

// 复制工具
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            showCopyTip();
        }).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        showCopyTip();
    } catch (e) {
        alert('复制失败，请手动复制');
    }
    document.body.removeChild(ta);
}

let copyTipTimer = null;
function showCopyTip() {
    const tip = document.getElementById('copyTip');
    tip.style.display = 'block';
    clearTimeout(copyTipTimer);
    copyTipTimer = setTimeout(() => {
        tip.style.display = 'none';
    }, 1500);
}

window.onload = function() {
    changeServer();
}
</script>
</body>
</html>
